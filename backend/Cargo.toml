[package]
name = "navikarier-backend"
version = "0.2.0"
edition = "2021"
description = "Backend NaviKarier (Axum + sqlx)"

[lib]
name = "navikarier"
path = "src/lib.rs"

[[bin]]
name = "navikarier-backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "multipart", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: FastAPI keeps dict insertion order; JSON key order must match.
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "time", "macros"] }
# `time`, not chrono: sqlx's chrono feature produced binaries that crash pre-main when linked with zig on Windows.
time = { version = "0.3", default-features = false, features = ["std"] }
# rust_crypto = pure Rust (no ring/C compiler), so it also builds on Windows dev boxes without a C toolchain.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.17"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# TLS for outbound HTTPS (Anthropic, Resend): rustls in containers, Schannel on Windows dev boxes
# (rustls pulls in `ring`, which needs a C compiler).
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
