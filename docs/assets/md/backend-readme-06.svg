<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 232" width="1280" height="232" role="img" aria-label="Produksi: Image dibangun dari Dockerfile ini. Saat start, container menjalankan alembic upgrade head lalu uvicorn di port 8000. Konfigurasi produksi ada di ../deploy/."><style>@font-face{font-family:"Inter";font-weight:400 700;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(data:font/woff2;base64,) format("woff2")}</style><rect width="1280" height="232" rx="24" fill="#09090b"/><rect x=".5" y=".5" width="1279" height="231" rx="24" fill="none" stroke="#27272a"/><g font-family="Inter, Helvetica, Arial, sans-serif"><text x="56" y="93" font-size="40" font-weight="600" fill="#f4f4f5">Produksi</text><text x="56" y="149" font-size="22" font-weight="400" fill="#f4f4f5">Image dibangun dari <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">Dockerfile</tspan> ini. Saat start, container menjalankan <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">alembic</tspan><tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa"> </tspan><tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">upgrade</tspan><tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa"> </tspan><tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">head</tspan> lalu <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">uvicorn</tspan></text><text x="56" y="184" font-size="22" font-weight="400" fill="#f4f4f5">di port 8000. Konfigurasi produksi ada di <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#60a5fa">../deploy/</tspan>.</text></g></svg>